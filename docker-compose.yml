services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8s-log-explorer-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount kubectl config from host
      - ~/.kube:/root/.kube:ro
      # Mount database directory for persistence
      - ./data:/app/data
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/logs.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: k8s-log-explorer-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
